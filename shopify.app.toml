# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "24143f6f7f7be925cb7037a74f9915b2"
application_url = "https://process-list-beryl.vercel.app"
embedded = true
name = "Process-list"

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  # Order, fulfillment and inventory webhooks are registered per shop through the
  # Admin API (app/services/webhookRegistration.server.js). Declaring a topic here
  # as well makes Shopify deliver each event twice.

[product.metafields.app.demo_info]
type = "single_line_text_field"
name = "Demo Source Info"
description = "Tracks products created by the Shopify app template for development"

  [product.metafields.app.demo_info.access]
  admin = "merchant_read_write"

[metaobjects.app.example]
name = "Example"
description = "An example metaobject definition created by this template"

  [metaobjects.app.example.access]
  admin = "merchant_read_write"

[metaobjects.app.example.fields.title]
name = "Title"
type = "single_line_text_field"
required = true

[metaobjects.app.example.fields.description]
name = "Description"
type = "multi_line_text_field"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_all_orders,read_content,read_customers,read_discounts,read_orders,write_content,write_customers,write_discounts,write_draft_orders,write_metaobject_definitions,write_metaobjects,write_orders,write_products,read_fulfillments,read_inventory"

[auth]
redirect_urls = [ "https://process-list-beryl.vercel.app" ]

# dawayo.de/apps/dawayo-reviews/* → process-list /proxy/* (product reviews on the web shop)
[app_proxy]
url = "https://process-list-beryl.vercel.app/proxy"
subpath = "dawayo-reviews"
prefix = "apps"

[build]
automatically_update_urls_on_dev = true
