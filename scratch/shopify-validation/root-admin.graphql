query FindInspectionOrder($query:String!) { orders(first:1,query:$query) { nodes { id name email cancelledAt lineItems(first:100) {
  pageInfo { hasNextPage endCursor }
  edges { node { id title variantTitle sku quantity variant { id title sku barcode image { url }
    product { featuredImage { url } expiryDate:metafield(namespace:"freshly",key:"expiry_date") { value } }
  } } }
} } } }

query InspectionOrder($id:ID!) { order(id:$id) { id name email cancelledAt lineItems(first:100) {
  pageInfo { hasNextPage endCursor }
  edges { node { id title variantTitle sku quantity variant { id title sku barcode image { url }
    product { featuredImage { url } expiryDate:metafield(namespace:"freshly",key:"expiry_date") { value } }
  } } }
} } }

query InspectionSubstitutes($ids:[ID!]!) { nodes(ids:$ids) { ... on ProductVariant { id title product { title } } } }

query OrderAddressOwner($id:ID!) { order(id:$id) { id name customer { id vat:metafield(namespace:"custom",key:"vat") { value } } } }

mutation SetOrderCustomerVat($metafields:[MetafieldsSetInput!]!) {
  metafieldsSet(metafields:$metafields) { metafields { id } userErrors { field message } }
}

mutation DeleteOrderCustomerVat($metafields:[MetafieldIdentifierInput!]!) {
  metafieldsDelete(metafields:$metafields) { deletedMetafields { ownerId namespace key } userErrors { field message } }
}

query InvoiceOrderAccess($ids:[ID!]!) { nodes(ids:$ids) { ... on Order { id } } }


      #graphql
      query getDetailedOrders0($ids: [ID!]!) {
        nodes(ids: $ids) {
          ... on Order {
            id
            name
            createdAt
            email
            note
            displayFinancialStatus
            cancelledAt
            cancelReason
            returnStatus
            tags
            events(first: 10) {
              edges {
                node {
                  id
                  message
                  createdAt
                }
              }
            }
            customAttributes {
              key
              value
            }
            displayFulfillmentStatus
            paymentGatewayNames
            customer {
              id
              numberOfOrders
              vat: metafield(namespace: "custom", key: "vat") {
                id
                value
              }
            }
            taxesIncluded
            taxLines {
              title
              rate
              priceSet { shopMoney { amount currencyCode } }
            }
            totalPriceSet { shopMoney { amount currencyCode } }
            subtotalPriceSet { shopMoney { amount currencyCode } }
            totalTaxSet { shopMoney { amount currencyCode } }
            totalShippingPriceSet { shopMoney { amount currencyCode } }
            totalDiscountsSet { shopMoney { amount currencyCode } }
            discountApplications(first: 10) {
              edges {
                node {
                  allocationMethod
                  targetSelection
                  targetType
                  value {
                    ... on PricingPercentageValue {
                      percentage
                    }
                    ... on MoneyV2 {
                      amount
                      currencyCode
                    }
                  }
                }
              }
            }
            totalRefundedSet { shopMoney { amount currencyCode } }
            totalOutstandingSet { shopMoney { amount currencyCode } }
            shippingLines(first: 10) {
              pageInfo { hasNextPage endCursor }
              edges {
                node {
                  id
                  title
                  taxLines { rate priceSet { shopMoney { amount currencyCode } } }
                }
              }
            }
            billingAddress {
              name company address1 address2 zip city country phone countryCode
            }
            shippingAddress {
              name company address1 address2 zip city country phone countryCode
            }
            lineItems(first: 50) {

              pageInfo { hasNextPage endCursor }
              edges {
                node {
                  id
                  title
                  sku
                  variantTitle
                  quantity
                  originalUnitPriceSet { shopMoney { amount currencyCode } }
                  discountedUnitPriceSet { shopMoney { amount currencyCode } }
                  originalTotalSet { shopMoney { amount currencyCode } }
                  discountedTotalSet { shopMoney { amount currencyCode } }
                  discountAllocations {
                    allocatedAmountSet {
                      shopMoney {
                        amount
                        currencyCode
                      }
                    }
                  }
                  taxable
                  taxLines {
                    title
                    rate
                    priceSet { shopMoney { amount currencyCode } }
                  }
                  variant {
                    id
                    title
                    sku
                    barcode
                    price
                    compareAtPrice
                    inventoryItem {
                      measurement {
                        weight {
                          value
                          unit
                        }
                      }
                    }
                    image { url src } 
                    product {
                      featuredImage { url src } 
                      germanTranslation: metafield(namespace: "global", key: "german_translation") { value }
                      expiryDate: metafield(namespace: "freshly", key: "expiry_date") { value }
                      position: metafield(namespace: "custom", key: "position") { value }
                      producttype: metafield(namespace: "custom", key: "producttype") { value }
                    }
                  }
                }
              }
            }
          }
        }
      }
    


